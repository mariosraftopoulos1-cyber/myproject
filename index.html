<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architect Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">ARCHITECT</a>
  </div>
</nav>

<section class="hero">
  <div class="overlay"></div>
  <div class="content text-center">
    <h1 data-aos="fade-up">Design Beyond Limits</h1>
    <p data-aos="fade-up" data-aos-delay="200">Modern Architecture Studio</p>
  </div>
</section>

<section class="section text-center">
  <div class="container">
    <h2 data-aos="fade-up">About</h2>
    <p data-aos="fade-up">We design spaces that inspire and innovate.</p>
  </div>
</section>

<section class="section bg-light">
  <div class="container text-center">
    <h2 data-aos="fade-up">Services</h2>
    <div class="row mt-4">
      <div class="col-md-4" data-aos="zoom-in">Architecture</div>
      <div class="col-md-4" data-aos="zoom-in">Interior</div>
      <div class="col-md-4" data-aos="zoom-in">Consulting</div>
    </div>
  </div>
</section>

<section class="section text-center">
  <div class="container">
    <div class="row">
      <div class="col-md-4"><h2 class="counter" data-target="120">0</h2><p>Projects</p></div>
      <div class="col-md-4"><h2 class="counter" data-target="15">0</h2><p>Years</p></div>
      <div class="col-md-4"><h2 class="counter" data-target="50">0</h2><p>Clients</p></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="text-center mb-5">Projects</h2>
    <div class="row g-4">

      <div class="col-md-4">
        <a href="https://picsum.photos/1200/800?1" class="glightbox">
          <img src="https://picsum.photos/400/300?1" class="img-fluid">
        </a>
      </div>

      <div class="col-md-4">
        <a href="https://picsum.photos/1200/800?2" class="glightbox">
          <img src="https://picsum.photos/400/300?2" class="img-fluid">
        </a>
      </div>

      <div class="col-md-4">
        <a href="https://picsum.photos/1200/800?3" class="glightbox">
          <img src="https://picsum.photos/400/300?3" class="img-fluid">
        </a>
      </div>

    </div>
  </div>
</section>

<section class="section bg-light text-center">
  <div class="container">
    <h2>Testimonials</h2>
    <div id="carouselExample" class="carousel slide mt-4">
      <div class="carousel-inner">
        <div class="carousel-item active">"Amazing design!"</div>
        <div class="carousel-item">"Professional team."</div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="text-center">Contact</h2>
    <form>
      <input class="form-control mb-3" placeholder="Name">
      <input class="form-control mb-3" placeholder="Email">
      <textarea class="form-control mb-3" placeholder="Message"></textarea>
      <button class="btn btn-dark w-100">Send</button>
    </form>
  </div>
</section>

<footer class="text-center p-4 bg-dark text-white">
  © 2026 Architect Studio
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/js/glightbox.min.js"></script>

<script src="js/main.js"></script>

</body>
</html>
